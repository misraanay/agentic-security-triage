services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: agentic_security_triage
    volumes:
      - db_data:/var/lib/postgresql

  redis:
    image: redis:7
    
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://user:devpassword@db:5432/agentic_security_triage
    depends_on:
      - db
      - redis


volumes:
  db_data:



