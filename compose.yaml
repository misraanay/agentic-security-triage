services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: agentic_security_triage
    volumes:
      - db_data:/var/lib/postgresql

  redis:
    image: redis:7
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://user:devpassword@db:5432/agentic_security_triage
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MODEL=${MODEL}
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: celery -A app.celery_app:app worker --loglevel=INFO 
    environment:
      - DATABASE_URL=postgresql+psycopg://user:devpassword@db:5432/agentic_security_triage
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MODEL=${MODEL}
    depends_on:
      - redis
      - db

volumes:
  db_data: